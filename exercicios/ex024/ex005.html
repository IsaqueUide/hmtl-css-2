<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Document</title>
    <style>
        body{
            background-color: rgb(105, 105, 173);
            color: white;
        }
        a{
            color: white;

<body>
    <a href="#" onclick="clicou()">Clique em mim, por favor</a>
        <div id="saida"></div>

    <iframe src="" frameborder="0"></iframe>

    <script>
        function clicou(){
            s = window.document.getElementById("saida")
            s.innerHTML += '<p>Você clicou!</p>'
        }
    </script>
</body>
