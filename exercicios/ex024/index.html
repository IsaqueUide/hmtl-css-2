<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframe</title>
    <style>
        body{
            background-color: rgb(105, 105, 173);
            color: chartreuse;
        }
        a{
            color: chartreuse;
        }
        iframe{
            height: 500px;
            width: 500px;
        }
    </style>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 
        <iframe src="https://www.cursoemvideo.com/" frameborder="0"></iframe>
        para aprender a programar
    </p>
    <p>
        Esse meu sitezinho
        <iframe src="https://isaqueuide.github.io/hmtl-css-2/exercicios/ex022/fundo003.html" frameborder="0" scrolling="no">
            <a href="https://isaqueuide.github.io/hmtl-css-2/exercicios/ex022/fundo003.html">Esse meu sitezinho com um background de Lain é legal!</a>
        </iframe>
        com um background de Lain é legal!
    </p>
</body>
</html>
